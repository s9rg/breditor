[package]
name = "breditor-collab-relay"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
license = "MIT OR Apache-2.0"
description = "Opt-in durable reference host for Breditor rich collaboration"

[workspace]
resolver = "3"

[patch.crates-io]
loro-internal = { path = "../collaboration/vendor/loro-internal-1.16.2" }

[dependencies]
breditor-collab-feasibility = { path = "../collaboration" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = { version = "=0.11.0", default-features = false }
thiserror = "=2.0.20"
getrandom = "=0.4.3"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
