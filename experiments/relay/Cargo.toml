[package]
name = "breditor-collab-relay"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
license = "MIT OR Apache-2.0"
description = "Opt-in durable reference host for Breditor rich collaboration"

[workspace]
resolver = "3"

[patch.crates-io]
loro-internal = { path = "../collaboration/vendor/loro-internal-1.16.2" }

[dependencies]
breditor-collab-feasibility = { path = "../collaboration" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = { version = "=0.11.0", default-features = false }
thiserror = "=2.0.20"
getrandom = "=0.4.3"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "ws", "tokio"], optional = true }
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"], optional = true }

[features]
server = ["dep:axum", "dep:tokio"]

[[bin]]
name = "breditor-collab-relay"
path = "src/main.rs"
required-features = ["server"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
