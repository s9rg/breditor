[package]
name = "breditor-collab-relay"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
license = "MIT OR Apache-2.0"
description = "Opt-in durable reference host for Breditor rich collaboration"

[workspace]
resolver = "3"

[patch.crates-io]
loro-internal = { path = "../../crates/breditor-collaboration/vendor/loro-internal-1.16.2" }

[dependencies]
flate2 = { version = "=1.1.10", default-features = false, features = ["zlib-rs"] }
base64 = { version = "=0.22.1", optional = true }
breditor-collab-feasibility = { path = "../collaboration" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["raw_value"] }
sha2 = { version = "=0.11.0", default-features = false }
thiserror = "=2.0.20"
getrandom = "=0.4.3"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "ws", "tokio"], optional = true }
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"], optional = true }

[features]
server = ["dep:axum", "dep:tokio", "dep:base64"]

[[bin]]
name = "breditor-collab-relay"
path = "src/main.rs"
required-features = ["server"]

[[example]]
name = "network_demo"
path = "examples/network_demo.rs"
required-features = ["server"]

