[workspace]
members = ["crates/breditor-core", "crates/breditor-wasm"]
resolver = "3"

[workspace.package]
version = "0.3.0-alpha.6"
edition = "2024"
rust-version = "1.98"
authors = ["Breditor contributors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["raw_value"] }
sha2 = { version = "=0.11.0", default-features = false }
thiserror = "2.0.20"
unicode-segmentation = "=1.13.3"
wasm-bindgen = "=0.2.127"
wasm-bindgen-test = "=0.3.77"

# Native release builds retain throughput-oriented optimization. The published
# Wasm package uses the dedicated `wasm-release` profile below so its size
# policy cannot silently change the native engine's optimization strategy.
[profile.release]
opt-level = 3
lto = false
codegen-units = 1

# The package scripts are the only supported path for producing shipped Wasm.
# Size-oriented LLVM optimization plus whole-program LTO keeps ABI 4 below its
# checked release budgets without a post-link binary rewriter. Aborting panics
# match wasm32's fail-closed boundary, while stripping symbols prevents debug
# metadata from leaking into the distributable module.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[workspace.lints.rust]
missing_docs = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_code = "forbid"
unreachable_pub = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
