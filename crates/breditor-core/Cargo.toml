[package]
name = "breditor-core"
description = "Deterministic content kernel for the Breditor rich-text editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[features]
# Internal structural-schema work only. The default editor/Wasm package stays
# paragraph-only until the complete structural editing contract is qualified.
experimental-structural-properties = []
# Additive semantic values only; does not widen existing schemas or codecs.
experimental-rich-content = ["experimental-structural-properties"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
unicode-segmentation.workspace = true

[dev-dependencies]
proptest = { version = "1.11.0", default-features = false, features = ["std"] }

[lints]
workspace = true
