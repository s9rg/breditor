[package]
name = "breditor-core"
description = "Deterministic content kernel for the Breditor rich-text editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[features]
# Internal structural-schema work only. The default editor/Wasm package stays
# paragraph-only until the complete structural editing contract is qualified.
experimental-structural-properties = []
# Separate rich AST admission and semantic values; existing profiles stay exact.
experimental-rich-content = ["experimental-structural-properties", "dep:regex-automata"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
unicode-segmentation.workspace = true
# Native search is opt-in with the rich grammar. Default packages keep their
# existing graph; Unicode matching never uses a browser regex or backtracking VM.
regex-automata = { version = "=0.4.18", default-features = false, features = ["std", "meta", "unicode", "perf", "hybrid"], optional = true }

[dev-dependencies]
proptest = { version = "1.11.0", default-features = false, features = ["std"] }

[lints]
workspace = true

[[example]]
name = "general_range_checkpoint_probe"
required-features = ["experimental-rich-content"]
