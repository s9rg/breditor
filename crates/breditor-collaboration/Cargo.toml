[package]
name = "breditor-collaboration"
version = "0.3.0-alpha.22"
edition = "2024"
rust-version = "1.98"
publish = false
license = "MIT OR Apache-2.0"
description = "Optional original Breditor shared rich editor and guarded Wasm application owner"

[lib]
crate-type = ["rlib", "cdylib"]

[workspace]
resolver = "3"
exclude = ["vendor/loro-internal-1.16.2", "vendor/loro-1.16.2"]

[features]
default = []
# Probe APIs belong only to explicit compatibility qualification, never the app build.
research = []

[dependencies]
breditor-core = { path = "../breditor-core", features = ["experimental-rich-content"] }
# Path edges are intentional: Cargo ignores a dependency crate's [patch] section.
loro = { version = "=1.16.2", path = "vendor/loro-1.16.2", default-features = false }
loro-internal = { version = "=1.16.2", path = "vendor/loro-internal-1.16.2", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"
sha2 = { version = "=0.11.0", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.127"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[[example]]
name = "general_range_checkpoint_probe"
required-features = ["research"]

[[example]]
name = "shared_input_rules_checkpoint_probe"
required-features = ["research"]

[[example]]
name = "general_semantic_frame_probe"
required-features = ["research"]
