[package]
name = "breditor-wasm"
description = "Narrow WebAssembly boundary for the Breditor editor engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["selection-token-codes"]
# Production token transport. Opt out only for the local legacy comparison.
selection-token-codes = []
# Local investigation only. Default/release packaging never enables this.
diagnostic-selection-inputs = []
diagnostic-projection-format-count = []
# Unqualified local candidate; deliberately excluded from default packaging.
candidate-rust-selection-tokens = []
# Opt-in heading profile/Session V5 bridge. Never enabled by default packaging.
experimental-text-blocks = ["breditor-core/experimental-structural-properties"]
# Opt-in flat-list profile/Session V6 bridge; also retains the heading APIs.
experimental-flat-lists = ["experimental-text-blocks"]

[dependencies]
breditor-core = { path = "../breditor-core", version = "=0.3.0-alpha.22" }
serde.workspace = true
serde_json.workspace = true
wasm-bindgen.workspace = true

[dev-dependencies]
wasm-bindgen-test.workspace = true

[lints]
workspace = true
