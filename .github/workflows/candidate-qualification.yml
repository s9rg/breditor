{
  "name": "Candidate qualification (manual; not a release)",
  "run-name": "Candidate qualification / ${{ inputs.profile }}${{ inputs.shard != 'none' && format(' / {0}', inputs.shard) || '' }}",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "profile": {
          "description": "Full includes all matrices and the V1 ledger. Each other profile runs a documented subset.",
          "required": true,
          "default": "full",
          "type": "choice",
          "options": [
            "full",
            "functional",
            "default-matrix",
            "editor-browser-matrix",
            "rich-browser-matrix",
            "shared-browser-matrix",
            "installed-application-network",
            "portable-relay-recovery",
            "dependency-inventories",
            "installed-distribution-workflows",
            "input-writing-workflows",
            "installed-feature-browser",
            "sdk-types"
          ]
        },
        "shard": {
          "description": "Optional bounded group from the full profile.",
          "required": false,
          "default": "none",
          "type": "choice",
          "options": [
            "none",
            "native",
            "runtime-packages",
            "local-history",
            "participant-cohorts",
            "restored-history",
            "record-readers",
            "owner-lifecycle",
            "managed-sdk",
            "segmented-relay",
            "participant-recovery",
            "physical-room-catalogs",
            "physical-operation-custody",
            "selected-delivery",
            "metadata-handover",
            "native-handover-activation-installed",
            "joint-handover-source",
            "joint-handover-installed",
            "cold-joint-handover-source",
            "cold-joint-handover-installed",
            "sealed-joint-recovery-source",
            "sealed-joint-recovery-installed",
            "native-suggestion-delivery",
            "native-revision-delivery",
            "local-metadata-records",
            "local-metadata-references",
            "local-metadata-availability",
            "local-metadata-materialization",
            "recoverable-metadata",
            "metadata-server-bytes",
            "server-metadata",
            "server-native-dependencies",
            "local-metadata-receipt-containment",
            "local-metadata-packet-recovery",
            "server-packet-recovery",
            "current-server-packet-reconciliation",
            "independent-current-reconciliation",
            "native-cold-restart-auth-source",
            "native-cold-restart-auth-installed",
            "native-cold-restart-original-source",
            "native-cold-restart-original-installed",
            "native-cold-restart-review-segmented-source",
            "native-cold-restart-review-segmented-installed",
            "native-cold-restart-document-segmented-source",
            "native-cold-restart-document-segmented-installed",
            "native-cold-restart-both-segmented-source",
            "native-cold-restart-both-segmented-installed",
            "reconciled-packet-contracts-source",
            "reconciled-packet-contracts-installed",
            "reconciled-packet-availability-source",
            "reconciled-packet-availability-installed",
            "reconciled-packet-checked-source",
            "reconciled-packet-checked-installed",
            "reconciled-packet-compatibility-source",
            "reconciled-packet-compatibility-installed",
            "metadata-reconciliation-source",
            "metadata-reconciliation-installed",
            "native-version-delivery",
            "held-metadata",
            "metadata-work",
            "selected-room-storage",
            "generation-component-reconstruction-source",
            "generation-component-reconstruction-installed"
          ]
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "qualify": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 360,
      "env": {
        "CARGO_TERM_COLOR": "never"
      },
      "steps": [
        {
          "name": "Reserve time for evidence upload",
          "run": "echo \"CANDIDATE_EVIDENCE_DEADLINE=$(( $(date +%s) + 345 * 60 ))\" >> \"$GITHUB_ENV\""
        },
        {
          "name": "Check out the selected source",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 1
          },
          "id": "checkout"
        },
        {
          "name": "Install the baseline Node toolchain",
          "uses": "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1",
          "with": {
            "node-version": "22.14.0",
            "package-manager-cache": false
          },
          "id": "node"
        },
        {
          "name": "Install the paired Rust/Wasm toolchain",
          "run": "rustup toolchain install 1.98.0 --profile minimal --component clippy --component rustfmt --target wasm32-unknown-unknown\ncargo install wasm-bindgen-cli --version 0.2.127 --locked",
          "id": "rust"
        },
        {
          "name": "Install workspace dependencies and prepare the offline fixture cache",
          "run": "npm ci --ignore-scripts --no-audit --no-fund\nnode scripts/prepare-candidate-npm-cache.mjs",
          "id": "npm"
        },
        {
          "name": "Fetch locked Cargo graphs before offline qualification",
          "run": "cargo fetch --locked --manifest-path Cargo.toml\ncargo fetch --locked --manifest-path crates/breditor-collaboration/Cargo.toml\ncargo fetch --locked --manifest-path experiments/collaboration/Cargo.toml\ncargo fetch --locked --manifest-path experiments/relay/Cargo.toml",
          "id": "cargo"
        },
        {
          "name": "Install all three test engines for browser qualification",
          "if": "${{ (inputs.profile == 'full' && inputs.shard == 'none') || inputs.profile == 'default-matrix' || inputs.profile == 'editor-browser-matrix' || inputs.profile == 'rich-browser-matrix' || inputs.profile == 'shared-browser-matrix' || inputs.profile == 'installed-application-network' || inputs.profile == 'installed-feature-browser' }}",
          "run": "node node_modules/@playwright/test/cli.js install --with-deps chromium firefox webkit",
          "id": "browsers"
        },
        {
          "name": "Qualify the selected candidate profile",
          "env": {
            "CANDIDATE_PROFILE": "${{ inputs.profile }}",
            "CARGO_NET_OFFLINE": "true",
            "CANDIDATE_SHARD": "${{ inputs.shard }}"
          },
          "run": "case \"$CANDIDATE_PROFILE\" in\n  full) args=() ;;\n  functional|default-matrix|editor-browser-matrix|rich-browser-matrix|shared-browser-matrix|installed-application-network|portable-relay-recovery|dependency-inventories|installed-distribution-workflows|input-writing-workflows|installed-feature-browser|sdk-types) args=(\"--$CANDIDATE_PROFILE\") ;;\n  *) echo \"Unsupported candidate qualification profile\" >&2; exit 2 ;;\nesac\nif [[ -n ${CANDIDATE_SHARD:-} && $CANDIDATE_SHARD != none ]]; then\n  args+=(--shard \"$CANDIDATE_SHARD\")\nfi\nif [[ ! ${CANDIDATE_EVIDENCE_DEADLINE:-} =~ ^[1-9][0-9]{0,11}$ ]]; then\n  echo \"Missing or invalid candidate evidence deadline\" >&2\n  exit 2\nfi\nremaining=$(( CANDIDATE_EVIDENCE_DEADLINE - $(date +%s) ))\nif (( remaining <= 0 )); then\n  echo \"Candidate deadline elapsed during setup\" >&2\n  exit 124\nfi\ntimeout --signal=TERM --kill-after=2m \"${remaining}s\" node scripts/verify-candidate.mjs \"${args[@]}\"",
          "id": "candidate"
        },
        {
          "name": "Record qualification setup and stage outcomes",
          "if": "${{ always() }}",
          "env": {
            "CANDIDATE_PROFILE": "${{ inputs.profile }}",
            "CHECKOUT_OUTCOME": "${{ steps.checkout.outcome }}",
            "NODE_OUTCOME": "${{ steps.node.outcome }}",
            "RUST_OUTCOME": "${{ steps.rust.outcome }}",
            "NPM_OUTCOME": "${{ steps.npm.outcome }}",
            "CARGO_OUTCOME": "${{ steps.cargo.outcome }}",
            "BROWSERS_OUTCOME": "${{ steps.browsers.outcome }}",
            "CANDIDATE_OUTCOME": "${{ steps.candidate.outcome }}",
            "CANDIDATE_SHARD": "${{ inputs.shard }}"
          },
          "run": "mkdir -p target/v1-candidate-runs\nprintf '%s\t%s\n' \\\n  format 1 repository \"$GITHUB_REPOSITORY\" workflow \"$GITHUB_WORKFLOW_REF\" event \"$GITHUB_EVENT_NAME\" \\\n  runId \"$GITHUB_RUN_ID\" runAttempt \"$GITHUB_RUN_ATTEMPT\" \\\n  revision \"$GITHUB_SHA\" profile \"$CANDIDATE_PROFILE\" shard \"${CANDIDATE_SHARD:-none}\" os \"$RUNNER_OS\" arch \"$RUNNER_ARCH\" \\\n  checkout \"${CHECKOUT_OUTCOME:-unavailable}\" node \"${NODE_OUTCOME:-unavailable}\" \\\n  rust \"${RUST_OUTCOME:-unavailable}\" npm \"${NPM_OUTCOME:-unavailable}\" cargo \"${CARGO_OUTCOME:-unavailable}\" \\\n  browsers \"${BROWSERS_OUTCOME:-unavailable}\" candidate \"${CANDIDATE_OUTCOME:-unavailable}\" \\\n  > target/v1-candidate-runs/runner-context.tsv\nif [[ -n \"${GITHUB_STEP_SUMMARY:-}\" ]]; then\n  if [[ -r scripts/summarize-candidate-run.mjs ]] && command -v node >/dev/null; then\n    node scripts/summarize-candidate-run.mjs >> \"$GITHUB_STEP_SUMMARY\"\n  else\n    printf '\\n## Candidate qualification\\n\\nSee runner-context.tsv in the uploaded artifact for setup outcomes.\\n' >> \"$GITHUB_STEP_SUMMARY\"\n  fi\nfi"
        },
        {
          "name": "Copy structured browser diagnostics after qualification failure",
          "if": "${{ failure() && steps.candidate.outcome == 'failure' }}",
          "run": "node scripts/retain-candidate-browser-reports.mjs"
        },
        {
          "name": "Retain candidate results and failure logs",
          "if": "${{ always() }}",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "candidate-${{ github.sha }}-${{ inputs.profile }}${{ inputs.shard != 'none' && format('-{0}', inputs.shard) || '' }}-${{ github.run_attempt }}",
            "path": "target/v1-candidate-runs/",
            "if-no-files-found": "error",
            "retention-days": 14,
            "include-hidden-files": false,
            "overwrite": false,
            "archive": true
          }
        },
        {
          "name": "Retain failed browser and demo traces",
          "if": "${{ failure() && steps.candidate.outcome == 'failure' }}",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "candidate-browser-failures-${{ github.sha }}-${{ github.run_attempt }}",
            "path": "target/playwright-results/**/trace.zip\ntarget/playwright-demo-results/**/trace.zip\ntarget/rich-browser-results/**/trace.zip\ntarget/editor-browser-results/**/trace.zip\ntarget/shared-browser-results/**/trace.zip\ntarget/shared-application-browser-results/**/trace.zip",
            "if-no-files-found": "ignore",
            "retention-days": 14,
            "include-hidden-files": false,
            "overwrite": false,
            "archive": true
          }
        }
      ],
      "defaults": {
        "run": {
          "shell": "bash"
        }
      }
    }
  }
}
