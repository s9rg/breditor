{
  "name": "Candidate qualification (manual; not a release)",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "profile": {
          "description": "Full includes all matrices and the V1 ledger. Each other profile runs a documented subset.",
          "required": true,
          "default": "full",
          "type": "choice",
          "options": [
            "full",
            "functional",
            "default-matrix",
            "editor-browser-matrix"
          ]
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "qualify": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 360,
      "env": {
        "CARGO_TERM_COLOR": "never"
      },
      "steps": [
        {
          "name": "Reserve time for evidence upload",
          "run": "echo \"CANDIDATE_EVIDENCE_DEADLINE=$(( $(date +%s) + 345 * 60 ))\" >> \"$GITHUB_ENV\""
        },
        {
          "name": "Check out the selected source",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 1
          },
          "id": "checkout"
        },
        {
          "name": "Install the baseline Node toolchain",
          "uses": "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1",
          "with": {
            "node-version": "22.14.0",
            "package-manager-cache": false
          },
          "id": "node"
        },
        {
          "name": "Install the paired Rust/Wasm toolchain",
          "run": "rustup toolchain install 1.98.0 --profile minimal --component clippy --component rustfmt --target wasm32-unknown-unknown\ncargo install wasm-bindgen-cli --version 0.2.127 --locked",
          "id": "rust"
        },
        {
          "name": "Install workspace dependencies and prepare the offline fixture cache",
          "run": "npm ci --ignore-scripts --no-audit --no-fund\nnode scripts/prepare-candidate-npm-cache.mjs",
          "id": "npm"
        },
        {
          "name": "Fetch locked Cargo graphs before offline qualification",
          "run": "cargo fetch --locked --manifest-path Cargo.toml\ncargo fetch --locked --manifest-path crates/breditor-collaboration/Cargo.toml\ncargo fetch --locked --manifest-path experiments/relay/Cargo.toml",
          "id": "cargo"
        },
        {
          "name": "Install all three test engines for browser qualification",
          "if": "${{ inputs.profile != 'functional' }}",
          "run": "node node_modules/@playwright/test/cli.js install --with-deps chromium firefox webkit",
          "id": "browsers"
        },
        {
          "name": "Qualify the selected candidate profile",
          "env": {
            "CANDIDATE_PROFILE": "${{ inputs.profile }}",
            "CARGO_NET_OFFLINE": "true"
          },
          "run": "case \"$CANDIDATE_PROFILE\" in\n  full) args=() ;;\n  functional|default-matrix|editor-browser-matrix) args=(\"--$CANDIDATE_PROFILE\") ;;\n  *) echo \"Unsupported candidate qualification profile\" >&2; exit 2 ;;\nesac\nif [[ ! ${CANDIDATE_EVIDENCE_DEADLINE:-} =~ ^[1-9][0-9]{0,11}$ ]]; then\n  echo \"Missing or invalid candidate evidence deadline\" >&2\n  exit 2\nfi\nremaining=$(( CANDIDATE_EVIDENCE_DEADLINE - $(date +%s) ))\nif (( remaining <= 0 )); then\n  echo \"Candidate deadline elapsed during setup\" >&2\n  exit 124\nfi\ntimeout --signal=TERM --kill-after=2m \"${remaining}s\" node scripts/verify-candidate.mjs \"${args[@]}\"",
          "id": "candidate"
        },
        {
          "name": "Record qualification setup and stage outcomes",
          "if": "${{ always() }}",
          "env": {
            "CANDIDATE_PROFILE": "${{ inputs.profile }}",
            "CHECKOUT_OUTCOME": "${{ steps.checkout.outcome }}",
            "NODE_OUTCOME": "${{ steps.node.outcome }}",
            "RUST_OUTCOME": "${{ steps.rust.outcome }}",
            "NPM_OUTCOME": "${{ steps.npm.outcome }}",
            "CARGO_OUTCOME": "${{ steps.cargo.outcome }}",
            "BROWSERS_OUTCOME": "${{ steps.browsers.outcome }}",
            "CANDIDATE_OUTCOME": "${{ steps.candidate.outcome }}"
          },
          "run": "mkdir -p target/v1-candidate-runs\nprintf '%s\t%s\n' \\\n  revision \"$GITHUB_SHA\" profile \"$CANDIDATE_PROFILE\" os \"$RUNNER_OS\" arch \"$RUNNER_ARCH\" \\\n  checkout \"${CHECKOUT_OUTCOME:-unavailable}\" node \"${NODE_OUTCOME:-unavailable}\" \\\n  rust \"${RUST_OUTCOME:-unavailable}\" npm \"${NPM_OUTCOME:-unavailable}\" cargo \"${CARGO_OUTCOME:-unavailable}\" \\\n  browsers \"${BROWSERS_OUTCOME:-unavailable}\" candidate \"${CANDIDATE_OUTCOME:-unavailable}\" \\\n  > target/v1-candidate-runs/runner-context.tsv\nif [[ -n \"${GITHUB_STEP_SUMMARY:-}\" ]]; then\n  if [[ -r scripts/summarize-candidate-run.mjs ]] && command -v node >/dev/null; then\n    node scripts/summarize-candidate-run.mjs >> \"$GITHUB_STEP_SUMMARY\"\n  else\n    printf '\\n## Candidate qualification\\n\\nSee runner-context.tsv in the uploaded artifact for setup outcomes.\\n' >> \"$GITHUB_STEP_SUMMARY\"\n  fi\nfi"
        },
        {
          "name": "Retain candidate results and failure logs",
          "if": "${{ always() }}",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "candidate-${{ github.sha }}-${{ inputs.profile }}-${{ github.run_attempt }}",
            "path": "target/v1-candidate-runs/",
            "if-no-files-found": "error",
            "retention-days": 14,
            "include-hidden-files": false,
            "overwrite": false,
            "archive": true
          }
        }
      ],
      "defaults": {
        "run": {
          "shell": "bash"
        }
      }
    }
  }
}
