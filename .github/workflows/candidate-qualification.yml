{
  "name": "Candidate qualification (manual; not a release)",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "profile": {
          "description": "Full includes browser/default-package checks and the fail-closed V1 ledger. Functional alone is not V1 approval.",
          "required": true,
          "default": "full",
          "type": "choice",
          "options": [
            "full",
            "functional"
          ]
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "qualify": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 360,
      "env": {
        "CARGO_TERM_COLOR": "never"
      },
      "steps": [
        {
          "name": "Check out the selected source",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 1
          }
        },
        {
          "name": "Install the baseline Node toolchain",
          "uses": "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1",
          "with": {
            "node-version": "22.14.0",
            "package-manager-cache": false
          }
        },
        {
          "name": "Install the paired Rust/Wasm toolchain",
          "run": "rustup toolchain install 1.98.0 --profile minimal --component clippy --component rustfmt --target wasm32-unknown-unknown\ncargo install wasm-bindgen-cli --version 0.2.127 --locked"
        },
        {
          "name": "Install locked workspace dependencies",
          "run": "npm ci --ignore-scripts --no-audit --no-fund"
        },
        {
          "name": "Fetch locked Cargo graphs before offline qualification",
          "run": "cargo fetch --locked --manifest-path Cargo.toml\ncargo fetch --locked --manifest-path crates/breditor-collaboration/Cargo.toml\ncargo fetch --locked --manifest-path experiments/relay/Cargo.toml"
        },
        {
          "name": "Install all three test engines for the full profile",
          "if": "${{ inputs.profile == 'full' }}",
          "run": "node node_modules/@playwright/test/cli.js install --with-deps chromium firefox webkit"
        },
        {
          "name": "Qualify the selected candidate profile",
          "env": {
            "CANDIDATE_PROFILE": "${{ inputs.profile }}",
            "CARGO_NET_OFFLINE": "true"
          },
          "run": "case \"$CANDIDATE_PROFILE\" in\n  full) node scripts/verify-candidate.mjs ;;\n  functional) node scripts/verify-candidate.mjs --functional ;;\n  *) echo \"Unsupported candidate qualification profile\" >&2; exit 2 ;;\nesac"
        },
        {
          "name": "Retain candidate results and failure logs",
          "if": "${{ always() }}",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "candidate-${{ github.sha }}-${{ inputs.profile }}-${{ github.run_attempt }}",
            "path": "target/v1-candidate-runs/",
            "if-no-files-found": "error",
            "retention-days": 14,
            "include-hidden-files": false,
            "overwrite": false,
            "archive": true
          }
        }
      ],
      "defaults": {
        "run": {
          "shell": "bash"
        }
      }
    }
  }
}
