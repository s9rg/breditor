[package]
name = "breditor-structural-v2-compat"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]
resolver = "3"

[dependencies]
breditor-collaboration = { path = "../../../crates/breditor-collaboration" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[profile.dev]
debug = 0
incremental = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
